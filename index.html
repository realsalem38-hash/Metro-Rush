<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Metro Rush</title>

<!-- [UI RESPONSIVA] Ajusta a escala global da UI conforme o viewport real -->
<script>
(function () {
  function applyUIScale() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;

    var scaleW = vw / 390;
    var scaleH = Math.min(1.15, Math.max(0.72, vh / 780));
    var scale = Math.min(scaleW, scaleH);

    scale = Math.max(0.72, Math.min(1.18, scale));

    if (vw < 340) scale *= 0.94;
    if (vw < 300) scale *= 0.92;

    document.documentElement.style.setProperty('--ui-scale', scale.toFixed(3));

    var mv = document.querySelector('meta[name="viewport"]');
    if (mv) {
      mv.setAttribute('content',
        'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover');
    }
  }
  window.addEventListener('resize', applyUIScale);
  window.addEventListener('orientationchange', applyUIScale);
  applyUIScale();
})();
</script>

<style>
  :root {
    --ui-scale: 1;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0e1a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
    touch-action: none;
  }

  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }

  #uiOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .hud {
    position: absolute;
    top: calc(12px * var(--ui-scale));
    left: calc(12px * var(--ui-scale));
    right: calc(12px * var(--ui-scale));
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .hud-box {
    background: rgba(10, 14, 26, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: calc(12px * var(--ui-scale));
    padding: calc(8px * var(--ui-scale)) calc(14px * var(--ui-scale));
    color: #e8f0ff;
    font-size: calc(16px * var(--ui-scale));
    font-weight: 600;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  }

  .hud-box .label {
    font-size: calc(10px * var(--ui-scale));
    font-weight: 500;
    color: #7ea8d8;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: block;
    margin-bottom: calc(1px * var(--ui-scale));
  }

  .hud-box .value {
    display: block;
    line-height: 1.1;
  }

  #coinValue {
    color: #ffd54a;
  }

  /* Power-up indicator */
  #powerupBar {
    position: absolute;
    bottom: calc(24px * var(--ui-scale));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 14, 26, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(120, 180, 255, 0.3);
    border-radius: calc(20px * var(--ui-scale));
    padding: calc(6px * var(--ui-scale)) calc(16px * var(--ui-scale));
    color: #7ee0ff;
    font-size: calc(13px * var(--ui-scale));
    font-weight: 600;
    display: none;
    pointer-events: none;
    box-shadow: 0 0 20px rgba(80, 180, 255, 0.35);
    white-space: nowrap;
  }

  #powerupBar.active {
    display: block;
    animation: pulseGlow 1s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 12px rgba(80, 180, 255, 0.35); }
    50% { box-shadow: 0 0 26px rgba(80, 180, 255, 0.7); }
  }

  /* Start / Game Over screen */
  #screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(20, 40, 80, 0.85), rgba(5, 8, 15, 0.97));
    z-index: 20;
    padding: calc(20px * var(--ui-scale));
    text-align: center;
    pointer-events: auto;
    transition: opacity 0.35s ease;
  }

  #screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #screen h1 {
    font-size: calc(38px * var(--ui-scale));
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #7ee0ff, #4a90ff, #a06bff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: calc(6px * var(--ui-scale));
    filter: drop-shadow(0 0 20px rgba(80, 180, 255, 0.4));
  }

  #screen .subtitle {
    color: #8aa8cc;
    font-size: calc(13px * var(--ui-scale));
    margin-bottom: calc(28px * var(--ui-scale));
    letter-spacing: 1px;
  }

  #screen .final-score {
    color: #ffd54a;
    font-size: calc(22px * var(--ui-scale));
    font-weight: 700;
    margin-bottom: calc(20px * var(--ui-scale));
  }

  #startBtn {
    pointer-events: auto;
    cursor: pointer;
    background: linear-gradient(135deg, #2a6bff, #6a3aff);
    border: none;
    border-radius: calc(14px * var(--ui-scale));
    color: #fff;
    font-size: calc(18px * var(--ui-scale));
    font-weight: 700;
    letter-spacing: 1px;
    padding: calc(14px * var(--ui-scale)) calc(42px * var(--ui-scale));
    box-shadow: 0 6px 28px rgba(60, 110, 255, 0.45);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    font-family: inherit;
  }

  #startBtn:active {
    transform: scale(0.95);
    box-shadow: 0 3px 14px rgba(60, 110, 255, 0.3);
  }

  .hint {
    margin-top: calc(26px * var(--ui-scale));
    color: #5a7a9a;
    font-size: calc(11px * var(--ui-scale));
    line-height: 1.6;
    max-width: calc(280px * var(--ui-scale));
  }

  .hint .key {
    color: #7ee0ff;
    font-weight: 600;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="uiOverlay">
  <div class="hud">
    <div class="hud-box">
      <span class="label">Moedas</span>
      <span class="value" id="coinValue">0</span>
    </div>
    <div class="hud-box">
      <span class="label">Distância</span>
      <span class="value" id="distValue">0 m</span>
    </div>
  </div>

  <div id="powerupBar">⚡ +5 Moedas!</div>
</div>

<div id="screen">
  <h1>METRO RUSH</h1>
  <div class="subtitle">Corra, desvie e colete</div>
  <div class="final-score" id="finalScore" style="display:none;"></div>
  <button id="startBtn">JOGAR</button>
  <div class="hint">
    <span class="key">← →</span> ou <span class="key">deslizar</span> para trocar de trilho<br>
    <span class="key">↑</span> ou <span class="key">toque</span> para pular<br>
    <span class="key">↓</span> para deslizar<br>
    Moeda <span style="color:#4a9eff;">azul</span> = +5 moedas instantâneas
  </div>
</div>

<script>
(function () {
  'use strict';

  // ============================================================
  // SETUP
  // ============================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const coinValueEl = document.getElementById('coinValue');
  const distValueEl = document.getElementById('distValue');
  const powerupBar = document.getElementById('powerupBar');
  const screenEl = document.getElementById('screen');
  const startBtn = document.getElementById('startBtn');
  const finalScoreEl = document.getElementById('finalScore');

  let W = 0, H = 0, DPR = 1;
  let scaleFactor = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    scaleFactor = Math.min(W / 390, H / 780);
    scaleFactor = Math.max(0.7, Math.min(1.2, scaleFactor));
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));
  resize();

  // ============================================================
  // GAME CONSTANTS
  // ============================================================
  const LANE_COUNT = 3;
  const BASE_SPEED = 0.55;
  const SPEED_RAMP = 0.000045;
  const MAX_SPEED = 2.2;

  const JUMP_VELOCITY = 0.042;
  const GRAVITY = 0.0022;
  const SLIDE_DURATION = 420;

  const PLAYER_Z = 0;
  const SPAWN_Z = 1;
  const DESPAWN_Z = -0.35;

  const OBSTACLE_SPAWN_DIST = 0.055;
  const COIN_SPAWN_DIST = 0.045;

  const BLUE_COIN_BONUS = 5; // <-- moedas ganhas ao pegar moeda azul

  // ============================================================
  // GAME STATE
  // ============================================================
  const state = {
    running: false,
    gameOver: false,
    time: 0,
    distance: 0,
    speed: BASE_SPEED,
    coins: 0,
    lane: 1,
    laneX: 1,
    targetLaneX: 1,
    laneLerp: 0.18,
    jumpY: 0,
    jumpVel: 0,
    jumping: false,
    sliding: false,
    slideTimer: 0,
    playerYOffset: 0,
    obstacles: [],
    coinObjects: [],
    particles: [],
    spawnDistObstacle: 0,
    spawnDistCoin: 0,
    blueCoinFlash: 0,
  };

  // ============================================================
  // INPUT
  // ============================================================
  let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
  let hasSwiped = false;

  function moveLane(dir) {
    if (!state.running) return;
    const nl = Math.max(0, Math.min(LANE_COUNT - 1, state.lane + dir));
    if (nl !== state.lane) {
      state.lane = nl;
      state.targetLaneX = nl;
    }
  }

  function doJump() {
    if (!state.running) return;
    if (state.jumping || state.sliding) return;
    state.jumping = true;
    state.jumpVel = JUMP_VELOCITY;
  }

  function doSlide() {
    if (!state.running) return;
    if (state.sliding) return;
    state.sliding = true;
    state.slideTimer = SLIDE_DURATION;
    if (state.jumping) {
      state.jumping = false;
      state.jumpVel = -JUMP_VELOCITY * 0.8;
    }
  }

  function handleKey(e) {
    if (!state.running) {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        startGame();
      }
      return;
    }
    switch (e.key) {
      case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); moveLane(-1); break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); moveLane(1); break;
      case 'ArrowUp': case 'w': case 'W': case ' ': e.preventDefault(); doJump(); break;
      case 'ArrowDown': case 's': case 'S': e.preventDefault(); doSlide(); break;
    }
  }
  window.addEventListener('keydown', handleKey);

  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = performance.now();
    hasSwiped = false;
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (hasSwiped) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const threshold = Math.max(22, W * 0.06);
    if (adx > threshold || ady > threshold) {
      hasSwiped = true;
      if (adx > ady) {
        moveLane(dx > 0 ? 1 : -1);
      } else {
        if (dy < 0) doJump();
        else doSlide();
      }
    }
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (hasSwiped) return;
    const dt = performance.now() - touchStartTime;
    if (dt < 250) doJump();
  }, { passive: true });

  // ============================================================
  // SPAWNING
  // ============================================================
  function spawnObstacle() {
    const lane = Math.floor(Math.random() * LANE_COUNT);
    const types = ['block', 'barrier', 'block'];
    const type = types[Math.floor(Math.random() * types.length)];
    state.obstacles.push({
      lane,
      x: lane,
      z: SPAWN_Z,
      type,
      w: 0.5,
      h: type === 'barrier' ? 0.9 : 0.6,
      passed: false,
    });
  }

  function spawnCoin() {
    const lane = Math.floor(Math.random() * LANE_COUNT);
    const isBlue = Math.random() < 0.18;
    state.coinObjects.push({
      lane,
      x: lane,
      z: SPAWN_Z,
      y: 0.35,
      blue: isBlue,
      collected: false,
      phase: Math.random() * Math.PI * 2,
    });
  }

  function spawnRow() {
    const lanes = [0, 1, 2];
    for (let i = lanes.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
    }
    const coinLane = lanes[0];
    const obstacleLanes = [lanes[1], lanes[2]];
    const blockCount = Math.random() < 0.4 ? 1 : 2;
    for (let i = 0; i < blockCount; i++) {
      const l = obstacleLanes[i];
      state.obstacles.push({
        lane: l, x: l, z: SPAWN_Z,
        type: 'block', w: 0.5, h: 0.6, passed: false,
      });
    }
    for (let i = 0; i < 2; i++) {
      state.coinObjects.push({
        lane: coinLane, x: coinLane, z: SPAWN_Z + i * 0.06,
        y: 0.35, blue: false, collected: false,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  // ============================================================
  // UPDATE
  // ============================================================
  function update(dt) {
    if (!state.running) return;

    state.time += dt;

    state.speed = Math.min(MAX_SPEED, BASE_SPEED + state.time * SPEED_RAMP);
    const move = state.speed * dt;
    state.distance += move * 10;

    state.spawnDistObstacle += move;
    state.spawnDistCoin += move;

    if (state.spawnDistObstacle > OBSTACLE_SPAWN_DIST) {
      state.spawnDistObstacle = 0;
      if (Math.random() < 0.75) spawnRow();
      else spawnObstacle();
    }
    if (state.spawnDistCoin > COIN_SPAWN_DIST) {
      state.spawnDistCoin = 0;
      if (Math.random() < 0.55) spawnCoin();
    }

    // Lane interpolation
    const speedLerp = 1 - Math.pow(1 - state.laneLerp, dt * 0.06);
    state.laneX += (state.targetLaneX - state.laneX) * Math.min(1, state.laneLerp * dt * 0.4);

    // Jump physics
    if (state.jumping) {
      state.jumpVel -= GRAVITY * dt;
      state.jumpY += state.jumpVel * dt;
      if (state.jumpY <= 0) {
        state.jumpY = 0;
        state.jumpVel = 0;
        state.jumping = false;
      }
    }

    // Slide
    if (state.sliding) {
      state.slideTimer -= dt;
      if (state.slideTimer <= 0) {
        state.sliding = false;
      }
    }

    // Move obstacles
    for (let i = state.obstacles.length - 1; i >= 0; i--) {
      const o = state.obstacles[i];
      o.z -= move;
      if (o.z < DESPAWN_Z) {
        state.obstacles.splice(i, 1);
        continue;
      }
      // Collision
      if (!o.passed && o.z < PLAYER_Z + 0.04 && o.z > PLAYER_Z - 0.06) {
        if (Math.abs(o.x - state.laneX) < 0.4) {
          if (o.type === 'barrier') {
            if (state.jumpY < 0.45) {
              endGame();
              return;
            }
          } else {
            if (state.jumpY < 0.3 && !state.sliding) {
              endGame();
              return;
            }
          }
        }
        o.passed = true;
      }
    }

    // Move coins
    for (let i = state.coinObjects.length - 1; i >= 0; i--) {
      const c = state.coinObjects[i];
      c.z -= move;
      c.phase += dt * 0.004;
      if (c.z < DESPAWN_Z) {
        state.coinObjects.splice(i, 1);
        continue;
      }
      if (!c.collected && Math.abs(c.z - PLAYER_Z) < 0.06 && Math.abs(c.x - state.laneX) < 0.42) {
        const dy = Math.abs(c.y - (state.jumpY + 0.25));
        if (dy < 0.5) {
          c.collected = true;
          if (c.blue) {
            // >>> MOEDA AZUL: +5 moedas instantâneas <<<
            state.coins += BLUE_COIN_BONUS;
            state.blueCoinFlash = 1;
            showPowerupBar();
            for (let k = 0; k < 12; k++) {
              state.particles.push({
                x: c.x, y: c.y, z: c.z,
                vx: (Math.random() - 0.5) * 0.02,
                vy: Math.random() * 0.03,
                vz: (Math.random() - 0.5) * 0.02,
                life: 1,
                color: '#4a9eff',
              });
            }
          } else {
            state.coins += 1;
            state.particles.push({
              x: c.x, y: c.y, z: c.z,
              vx: (Math.random() - 0.5) * 0.01,
              vy: Math.random() * 0.02,
              vz: 0,
              life: 1,
              color: '#ffd54a',
            });
          }
          coinValueEl.textContent = state.coins;
          state.coinObjects.splice(i, 1);
        }
      }
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * dt * 0.4;
      p.y += p.vy * dt * 0.4;
      p.z += p.vz * dt * 0.4;
      p.vy -= 0.00004 * dt;
      p.life -= dt * 0.0016;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    if (state.blueCoinFlash > 0) {
      state.blueCoinFlash -= dt * 0.002;
      if (state.blueCoinFlash < 0) state.blueCoinFlash = 0;
    }

    // HUD
    distValueEl.textContent = Math.floor(state.distance) + ' m';
  }

  // ============================================================
  // POWERUP BAR (apenas feedback visual)
  // ============================================================
  let powerupTimeout = null;
  function showPowerupBar() {
    powerupBar.classList.add('active');
    powerupBar.textContent = '⚡ +' + BLUE_COIN_BONUS + ' Moedas!';
    if (powerupTimeout) clearTimeout(powerupTimeout);
    powerupTimeout = setTimeout(() => {
      powerupBar.classList.remove('active');
    }, 1400);
  }

  // ============================================================
  // RENDER
  // ============================================================
  function project(x, y, z) {
    const horizonY = H * 0.34;
    const groundY = H * 0.88;
    const t = Math.max(0, Math.min(1.2, (1 - z) / 1.35));
    const t2 = t * t;
    const yWorld = (1 - t2) * horizonY + t2 * groundY;
    const roadHalf = W * 0.5;
    const spread = 0.5 + t * 1.15;
    const laneW = (roadHalf / LANE_COUNT) * spread * 0.62;
    const centerX = W * 0.5;
    const screenX = centerX + (x - 1) * laneW;
    const screenY = yWorld - (y || 0) * t * H * 0.32;
    const scale = 0.14 + t * 0.95;
    return { x: screenX, y: screenY, scale, t };
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.55);
    g.addColorStop(0, '#0a0e1a');
    g.addColorStop(0.5, '#141c33');
    g.addColorStop(1, '#1e2a4a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H * 0.55);

    // city silhouette
    ctx.fillStyle = 'rgba(10, 16, 30, 0.7)';
    const baseY = H * 0.34;
    for (let i = 0; i < 14; i++) {
      const bw = W / 14;
      const bh = (Math.sin(i * 1.7) * 0.5 + 0.5) * H * 0.14 + H * 0.04;
      ctx.fillRect(i * bw, baseY - bh, bw * 0.85, bh);
    }

    // neon glow
    const glow = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, W * 0.6);
    glow.addColorStop(0, 'rgba(60, 100, 200, 0.15)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H * 0.6);
  }

  function drawRoad() {
    const horizonY = H * 0.34;
    const groundY = H * 0.9;

    // ground base
    const g = ctx.createLinearGradient(0, horizonY, 0, H);
    g.addColorStop(0, '#141a2e');
    g.addColorStop(1, '#0a0e1a');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizonY, W, H - horizonY);

    // road
    const roadG = ctx.createLinearGradient(0, horizonY, 0, groundY);
    roadG.addColorStop(0, '#1e2840');
    roadG.addColorStop(1, '#2a3550');
    ctx.fillStyle = roadG;
    ctx.beginPath();
    ctx.moveTo(W * 0.5 - W * 0.08, horizonY);
    ctx.lineTo(W * 0.5 + W * 0.08, horizonY);
    ctx.lineTo(W * 0.5 + W * 0.52, groundY);
    ctx.lineTo(W * 0.5 - W * 0.52, groundY);
    ctx.closePath();
    ctx.fill();

    // lane lines
    ctx.strokeStyle = 'rgba(120, 160, 220, 0.12)';
    ctx.lineWidth = 2;
    for (let l = 1; l < LANE_COUNT; l++) {
      const bx = l * (W * 0.52) / LANE_COUNT;
      ctx.beginPath();
      ctx.moveTo(W * 0.5 - (W * 0.08) + l * (W * 0.16) / LANE_COUNT, horizonY);
      ctx.lineTo(W * 0.5 - (W * 0.52) + bx * 2, groundY);
      ctx.stroke();
    }

    // moving dashes
    const dashOffset = (state.time * state.speed * 0.5) % 1;
    for (let d = 0; d < 14; d++) {
      const z = 1 - ((d / 14 + dashOffset) % 1) * 1.35;
      if (z < DESPAWN_Z) continue;
      for (let l = 1; l < LANE_COUNT; l++) {
        const p = project(l - 1, 0, z);
        const p2 = project(l - 1, 0, z - 0.03);
        ctx.strokeStyle = 'rgba(140, 180, 255, 0.25)';
        ctx.lineWidth = Math.max(1, 3 * p.scale);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }
  }

  function drawObstacle(o) {
    const p = project(o.x, 0, o.z);
    if (p.t < 0.02) return;
    const w = 0.42 * p.scale * W * 0.4;
    const h = o.h * p.scale * H * 0.32;

    ctx.save();
    ctx.globalAlpha = Math.min(1, p.t * 2);

    // shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, w * 0.8, w * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    if (o.type === 'barrier') {
      // tall barrier
      const grd = ctx.createLinearGradient(p.x - w/2, p.y - h, p.x + w/2, p.y);
      grd.addColorStop(0, '#ff5a5a');
      grd.addColorStop(1, '#a02030');
      ctx.fillStyle = grd;
      ctx.fillRect(p.x - w/2, p.y - h, w, h);
      // stripes
      ctx.fillStyle = 'rgba(255, 220, 100, 0.85)';
      for (let s = 0; s < 3; s++) {
        ctx.fillRect(p.x - w/2, p.y - h + (s + 0.3) * (h/3.2), w, h/9);
      }
      // top glow
      ctx.fillStyle = 'rgba(255, 80, 80, 0.4)';
      ctx.fillRect(p.x - w/2, p.y - h - 3, w, 3);
    } else {
      // block
      const grd = ctx.createLinearGradient(p.x - w/2, p.y - h, p.x + w/2, p.y);
      grd.addColorStop(0, '#5a6a8a');
      grd.addColorStop(1, '#2a3550');
      ctx.fillStyle = grd;
      ctx.fillRect(p.x - w/2, p.y - h, w, h);
      ctx.strokeStyle = 'rgba(120, 170, 255, 0.5)';
      ctx.lineWidth = Math.max(1, 2 * p.scale);
      ctx.strokeRect(p.x - w/2, p.y - h, w, h);
      // hazard stripes
      ctx.fillStyle = 'rgba(255, 180, 60, 0.7)';
      ctx.fillRect(p.x - w/2, p.y - h * 0.7, w, h * 0.12);
    }

    ctx.restore();
  }

  function drawCoin(c) {
    const p = project(c.x, c.y + Math.sin(c.phase) * 0.05, c.z);
    if (p.t < 0.02) return;
    const r = Math.max(2, 8 * p.scale * (W / 390) * 0.9);
    const bob = Math.sin(c.phase) * r * 0.15;

    ctx.save();
    ctx.globalAlpha = Math.min(1, p.t * 2.2);

    // glow
    const glowR = r * 2.4;
    const glow = ctx.createRadialGradient(p.x, p.y + bob, 0, p.x, p.y + bob, glowR);
    if (c.blue) {
      glow.addColorStop(0, 'rgba(80, 160, 255, 0.55)');
      glow.addColorStop(1, 'rgba(80, 160, 255, 0)');
    } else {
      glow.addColorStop(0, 'rgba(255, 213, 74, 0.5)');
      glow.addColorStop(1, 'rgba(255, 213, 74, 0)');
    }
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(p.x, p.y + bob, glowR, 0, Math.PI * 2);
    ctx.fill();

    // coin body
    const grd = ctx.createRadialGradient(p.x - r*0.3, p.y + bob - r*0.3, r*0.1, p.x, p.y + bob, r);
    if (c.blue) {
      grd.addColorStop(0, '#b0e0ff');
      grd.addColorStop(0.6, '#4a9eff');
      grd.addColorStop(1, '#1a5ac0');
    } else {
      grd.addColorStop(0, '#fff4b0');
      grd.addColorStop(0.6, '#ffd54a');
      grd.addColorStop(1, '#c89a10');
    }
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(p.x, p.y + bob, r, 0, Math.PI * 2);
    ctx.fill();

    // inner ring
    ctx.strokeStyle = c.blue ? 'rgba(200, 235, 255, 0.8)' : 'rgba(255, 250, 200, 0.8)';
    ctx.lineWidth = Math.max(0.8, r * 0.12);
    ctx.beginPath();
    ctx.arc(p.x, p.y + bob, r * 0.68, 0, Math.PI * 2);
    ctx.stroke();

    // symbol
    ctx.fillStyle = c.blue ? '#0a2a60' : '#8a6a00';
    ctx.font = `bold ${Math.max(6, r * 1.1)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.blue ? '5' : '¢', p.x, p.y + bob + r * 0.05);

    ctx.restore();
  }

  function drawPlayer() {
    const p = project(state.laneX, state.jumpY, PLAYER_Z);
    const t = p.t;
    const baseY = p.y;
    const bodyW = Math.max(10, 22 * t * (W / 390) * 0.9);
    const bodyH = Math.max(14, 34 * t * (W / 390) * 0.9);

    // shadow
    const shadowScale = 1 - Math.min(0.7, state.jumpY * 1.5);
    ctx.fillStyle = `rgba(0,0,0,${0.45 * shadowScale})`;
    ctx.beginPath();
    ctx.ellipse(p.x, baseY, bodyW * 0.9 * shadowScale, bodyW * 0.35 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    const isSliding = state.sliding;
    const renderH = isSliding ? bodyH * 0.55 : bodyH;
    const renderW = isSliding ? bodyW * 1.4 : bodyW;

    // Body (jacket)
    const bodyGrd = ctx.createLinearGradient(p.x - renderW/2, baseY - renderH, p.x + renderW/2, baseY);
    bodyGrd.addColorStop(0, '#3a7aff');
    bodyGrd.addColorStop(1, '#1a3a9a');
    ctx.fillStyle = bodyGrd;
    ctx.beginPath();
    const r = Math.min(renderW, renderH) * 0.25;
    ctx.moveTo(p.x - renderW/2 + r, baseY - renderH);
    ctx.lineTo(p.x + renderW/2 - r, baseY - renderH);
    ctx.quadraticCurveTo(p.x + renderW/2, baseY - renderH, p.x + renderW/2, baseY - renderH + r);
    ctx.lineTo(p.x + renderW/2, baseY - r);
    ctx.quadraticCurveTo(p.x + renderW/2, baseY, p.x + renderW/2 - r, baseY);
    ctx.lineTo(p.x - renderW/2 + r, baseY);
    ctx.quadraticCurveTo(p.x - renderW/2, baseY, p.x - renderW/2, baseY - r);
    ctx.lineTo(p.x - renderW/2, baseY - renderH + r);
    ctx.quadraticCurveTo(p.x - renderW/2, baseY - renderH, p.x - renderW/2 + r, baseY - renderH);
    ctx.closePath();
    ctx.fill();

    // Hood / head
    const headR = renderW * 0.42;
    const headY = baseY - renderH - headR * 0.5;
    const headGrd = ctx.createRadialGradient(p.x - headR*0.25, headY - headR*0.25, headR*0.1, p.x, headY, headR);
    headGrd.addColorStop(0, '#6aaaff');
    headGrd.addColorStop(1, '#2a4aaa');
    ctx.fillStyle = headGrd;
    ctx.beginPath();
    ctx.arc(p.x, headY, headR, 0, Math.PI * 2);
    ctx.fill();

    // Eyes / visor
    ctx.fillStyle = 'rgba(180, 230, 255, 0.9)';
    ctx.beginPath();
    ctx.ellipse(p.x + headR * 0.15, headY - headR * 0.05, headR * 0.5, headR * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs (running animation)
    if (!isSliding) {
      const runPhase = Math.sin(state.time * 0.02 * state.speed * 2) * 0.5 + 0.5;
      ctx.strokeStyle = '#1a3a7a';
      ctx.lineWidth = Math.max(2, renderW * 0.16);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x - renderW * 0.18, baseY - renderH * 0.15);
      ctx.lineTo(p.x - renderW * 0.18 - renderW * 0.2 * runPhase, baseY);
      ctx.moveTo(p.x + renderW * 0.18, baseY - renderH * 0.15);
      ctx.lineTo(p.x + renderW * 0.18 + renderW * 0.2 * (1 - runPhase), baseY);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawParticles() {
    for (const p of state.particles) {
      const pr = project(p.x, p.y, p.z);
      if (pr.t < 0.02) continue;
      const r = Math.max(1, 4 * pr.scale * p.life * (W / 390) * 0.8);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawRoad();

    // Sort by z (far to near)
    const all = [];
    for (const o of state.obstacles) all.push({ type: 'obs', z: o.z, data: o });
    for (const c of state.coinObjects) all.push({ type: 'coin', z: c.z, data: c });
    for (const p of state.particles) all.push({ type: 'particle', z: p.z, data: p });
    all.push({ type: 'player', z: PLAYER_Z, data: null });
    all.sort((a, b) => b.z - a.z);

    for (const item of all) {
      if (item.type === 'obs') drawObstacle(item.data);
      else if (item.type === 'coin') drawCoin(item.data);
      else if (item.type === 'particle') {
        const p = item.data;
        const pr = project(p.x, p.y, p.z);
        if (pr.t < 0.02) continue;
        const r = Math.max(1, 4 * pr.scale * p.life * (W / 390) * 0.8);
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(pr.x, pr.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      else if (item.type === 'player') drawPlayer();
    }

    // Flash azul na tela ao pegar moeda azul
    if (state.blueCoinFlash > 0) {
      ctx.fillStyle = `rgba(60, 140, 255, ${state.blueCoinFlash * 0.18})`;
      ctx.fillRect(0, 0, W, H);
    }

    // Vignette
    const vg = ctx.createRadialGradient(W/2, H*0.5, H*0.3, W/2, H*0.5, H*0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ============================================================
  // GAME LOOP
  // ============================================================
  let lastTime = 0;
  let rafId = null;

  function loop(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min(50, now - lastTime);
    lastTime = now;

    if (state.running) {
      update(dt);
    }
    render();

    rafId = requestAnimationFrame(loop);
  }

  // ============================================================
  // GAME FLOW
  // ============================================================
  function startGame() {
    state.running = true;
    state.gameOver = false;
    state.time = 0;
    state.distance = 0;
    state.speed = BASE_SPEED;
    state.coins = 0;
    state.lane = 1;
    state.laneX = 1;
    state.targetLaneX = 1;
    state.jumpY = 0;
    state.jumpVel = 0;
    state.jumping = false;
    state.sliding = false;
    state.slideTimer = 0;
    state.obstacles = [];
    state.coinObjects = [];
    state.particles = [];
    state.spawnDistObstacle = 0;
    state.spawnDistCoin = 0;
    state.blueCoinFlash = 0;

    coinValueEl.textContent = '0';
    distValueEl.textContent = '0 m';
    powerupBar.classList.remove('active');

    screenEl.classList.add('hidden');
    finalScoreEl.style.display = 'none';

    if (rafId === null) {
      lastTime = 0;
      rafId = requestAnimationFrame(loop);
    }
  }

  function endGame() {
    state.running = false;
    state.gameOver = true;

    finalScoreEl.style.display = 'block';
    finalScoreEl.innerHTML = `🪙 ${state.coins} moedas &nbsp;·&nbsp; ${Math.floor(state.distance)} m`;
    screenEl.querySelector('h1').textContent = 'FIM DE JOGO';
    screenEl.querySelector('.subtitle').textContent = 'Você foi atingido!';
    startBtn.textContent = 'JOGAR NOVAMENTE';
    screenEl.classList.remove('hidden');
  }

  startBtn.addEventListener('click', () => {
    startGame();
  });

  // boot loop (render menu background)
  rafId = requestAnimationFrame(loop);
})();
</script>

</body>
